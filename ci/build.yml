# GitHub Action. ANEBASMA-STO-GITHUB.bat copies this file to .github/workflows/build.yml in the repository.
name: Build LabLock

# Every push to main builds LabLock.exe on Windows (a check that the code compiles).
# When the version in LabLock/Properties/AssemblyInfo.cs is new (no tag vX.Y.Z yet),
# it also makes the Release vX.Y.Z with LabLock.exe attached, ready to download.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the C# compiler that is part of Windows
        shell: cmd
        run: call build.cmd

      - uses: actions/upload-artifact@v4
        with:
          name: LabLock
          path: LabLock.exe

      - name: Version
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path LabLock/Properties/AssemblyInfo.cs -Pattern 'AssemblyVersion\("(\d+)\.(\d+)\.(\d+)' | Select-Object -First 1
          $v = '{0}.{1}.{2}' -f $m.Matches[0].Groups[1].Value, $m.Matches[0].Groups[2].Value, $m.Matches[0].Groups[3].Value
          git ls-remote --exit-code --tags origin "refs/tags/v$v" | Out-Null
          $new = if ($LASTEXITCODE -eq 0) { 'false' } else { 'true' }
          "version=$v" >> $env:GITHUB_OUTPUT
          "new=$new" >> $env:GITHUB_OUTPUT
          Write-Host "LabLock $v (new release: $new)"
          exit 0

      - name: Release
        if: steps.version.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: LabLock v${{ steps.version.outputs.version }}
          files: LabLock.exe
          generate_release_notes: true
