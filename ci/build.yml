# GitHub Action. ANEBASMA-STO-GITHUB.bat copies this file to .github/workflows/build.yml in the repository.
name: Build LabLock

# Every push to main builds LabLock.exe on Windows (a quick check that the code compiles).
# Pushing a tag such as v0.4.2 also makes a Release with LabLock.exe attached, ready to download.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build with the C# compiler that is part of Windows
        shell: cmd
        run: call build.cmd

      - uses: actions/upload-artifact@v4
        with:
          name: LabLock
          path: LabLock.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: LabLock ${{ github.ref_name }}
          files: LabLock.exe
          generate_release_notes: true
